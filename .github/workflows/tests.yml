name: tests
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/PROJECT_OVERVIEW.md khớp mã nguồn
        run: python3 scripts/project_overview.py --check
      - name: Hạ tầng test (PostgreSQL 55432, MinIO 59000, Qdrant 56333)
        run: docker compose -f compose.test.yaml up -d --wait
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
        working-directory: src/backend
      - run: python -m ruff check .     # docstring + type hint (pyproject.toml [tool.ruff.lint])
        working-directory: src/backend
      - run: python -m pytest -q
        working-directory: src/backend

  ai-local:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/ai-local } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"   # PyAV kèm sẵn ffmpeg; không cần torch
      - run: python -m ruff check .
      - run: python -m pytest -q    # engine giả; test model thật (-m models) chạy thủ công

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checks (docker-production-skill.md §17)
        run: for d in src/backend src/ai-local src/frontend src/object-storage; do docker build --check "$d"; done
      - name: Build runtime images
        run: |
          docker build --target runtime -t culture-atlas/backend:ci src/backend
          docker build --target runtime -t culture-atlas/ai-local:ci src/ai-local
          docker build --target runtime -t culture-atlas/web:ci src/frontend
      - name: Images run as non-root
        run: |
          for i in backend ai-local web; do
            u=$(docker run --rm --entrypoint id culture-atlas/$i:ci -u); echo "$i uid=$u"; test "$u" != "0"
          done
      - name: CVE scan (CRITICAL fails the build)
        run: |
          for i in backend ai-local web; do
            docker save culture-atlas/$i:ci -o "$RUNNER_TEMP/$i.tar"
            docker run --rm -v "$RUNNER_TEMP":/scan:ro aquasec/trivy:latest image --quiet --scanners vuln \
              --severity CRITICAL --exit-code 1 --input "/scan/$i.tar"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: src/frontend/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx ng test --watch=false
      - run: npx ng build
