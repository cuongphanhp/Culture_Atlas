name: tests
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: atlas, POSTGRES_PASSWORD: atlas, POSTGRES_DB: postgres }
        ports: [ "55432:5432" ]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:55432/culture_atlas_test
    defaults: { run: { working-directory: src/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  ai-local:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/ai-local } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y ffmpeg
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - run: python -m pytest -q    # engine giả; test model thật (-m models) chạy thủ công

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: src/frontend/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx ng test --watch=false
      - run: npx ng build
