services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: culture_atlas, POSTGRES_USER: atlas, POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas} }
    volumes: [ "pgdata:/var/lib/postgresql/data", "./src/database/culture_atlas.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro" ]
    ports: [ "5432:5432" ]
  api:
    build: ./src/backend
    env_file: .env
    environment: { AI_LOCAL_URL: "http://ai-local:8100" }
    depends_on: [ db, ai-local ]
    ports: [ "8000:8000" ]
  ai-local:
    build: ./src/ai-local
    environment: { AI_LOCAL_THREADS: "8" }
    volumes: [ "ai-models:/models" ]
    # Lần đầu: docker compose run --rm ai-local python -m ai_local.download
    healthcheck: { test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')" ], interval: 10s, retries: 30 }
  worker:
    build: ./src/backend
    command: python -m worker.scheduler
    env_file: .env
    depends_on: [ db ]
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ng serve --host 0.0.0.0"
    volumes: [ "./src/frontend:/app" ]
    ports: [ "4200:4200" ]
volumes:
  pgdata:
  ai-models:
