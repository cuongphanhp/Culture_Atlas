[project]
name = "culture-atlas-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "pgvector>=0.3",
  "pydantic-settings>=2.4", "PyJWT>=2.9", "argon2-cffi>=23.1", "httpx>=0.27", "apscheduler>=3.10",
  "requests>=2.32", "beautifulsoup4>=4.12", "lxml>=5.0", "selenium>=4.20", "openpyxl>=3.1", "psycopg[binary]>=3.2",
  "openai>=1.50", "python-multipart>=0.0.9", "minio>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ac(*ids): mã tiêu chí chấp nhận (docs/06-acceptance-criteria.md) mà test kiểm chứng",
  "route(method, path): endpoint test cần — chưa có trong app thì test PENDING (skip)",
  "db: cần PostgreSQL test (tự bỏ qua nếu không kết nối được, trừ khi ACCEPTANCE_STRICT=1)",
  "live: gọi dịch vụ thật (OpenAI…); chỉ chạy khi gọi -m live",
]
addopts = "-m 'not live' -rfE"

# Quy ước code (CLAUDE.md → "Code sạch"): mọi module / class / hàm public có docstring, mọi tham số và giá trị trả về có
# type hint. scripts/test.sh chạy `ruff check` trước pytest. Test chỉ cần tên + docstring module mô tả AC.
[tool.ruff.lint]
extend-select = ["D1", "ANN"]
ignore = ["D105", "D107", "ANN401"]   # __magic__/__init__ đã mô tả ở docstring class; Any dùng cho JSON tuỳ ý

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
