# Phục vụ bản build Angular + chuyển /api tới backend trong mạng Docker. Chạy non-root (nginx-unprivileged, cổng 8080).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;   # upload ghi âm ≤ 10 MB (AC21.2)

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;   # micro cho tính năng giọng nói

  # Media (ảnh / video / file) từ object storage MinIO — CHỈ đọc. Chặn mọi phương thức ghi ở đây vì bản MinIO đang dùng
  # có lỗi ghi object không xác thực (docs/security-exceptions.md). Không liệt kê bucket (chính sách chỉ cho GetObject).
  location ^~ /media/ {   # ^~: ưu tiên hơn rule regex file tĩnh (.jpg, .png…) bên dưới
    limit_except GET HEAD { deny all; }
    if ($request_uri ~ "[?]") { return 403; }          # không cho truyền tham số S3 (list-type, uploads, versionId…)
    proxy_pass http://object-storage:9000/culture-media/;
    proxy_http_version 1.1;
    proxy_set_header Host object-storage:9000;
    proxy_set_header Authorization "";
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header X-Amz-Bucket-Region;
    proxy_hide_header Server;
    proxy_intercept_errors on;
    error_page 403 404 = @media_missing;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location @media_missing { return 404; }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;        # stream SSE của AI Guide
    proxy_read_timeout 120s;
  }

  location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;   # route phía client của Angular
  }
}
